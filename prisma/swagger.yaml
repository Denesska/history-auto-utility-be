          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/OrganizationMembershipDto"
      security:
        - bearer: []
      summary: "List members of an organization visible to the caller (everyone below them in rank, never above — see OrganizationService.getMembers)"
