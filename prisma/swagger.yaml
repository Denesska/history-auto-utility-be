openapi: "3.0.0"
paths:
  /api/car/shared:
    get:
      operationId: "CarAccessController_getSharedCars"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SharedCarDto"
      security:
        - cookie: []
      summary: "Get all cars shared with the current user"
      tags:
        - "car-access"
  /api/car/access/user-search:
    get:
      operationId: "CarAccessController_searchUsers"
      parameters:
        - name: "q"
          required: true
          in: "query"
          schema:
            type: "string"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ShareUserSearchResultDto"
      security:
        - cookie: []
      summary: "Search registered users (name or email, min 3 chars) to share a car with"
      tags:
        - "car-access"
  /api/car/{carId}/access:
    get:
      operationId: "CarAccessController_getAccessList"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CarAccessDto"
      security:
        - cookie: []
      summary: "List all users with access to a car"
      tags:
        - "car-access"
  /api/car/{carId}/access/invite:
    post:
      operationId: "CarAccessController_inviteUser"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarAccessDto"
      security:
        - cookie: []
      summary: "Invite a registered user to access a car"
      tags:
        - "car-access"
  /api/car/{carId}/access/accept:
    post:
      operationId: "CarAccessController_acceptInvitation"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarAccessDto"
      security:
        - cookie: []
      summary: "Accept a pending invitation to a car"
      tags:
        - "car-access"
  /api/car/{carId}/access/{targetUserId}/role:
    patch:
      operationId: "CarAccessController_changeRole"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "targetUserId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarAccessDto"
      security:
        - cookie: []
      summary: "Change the role of a user on a car"
      tags:
        - "car-access"
  /api/car/{carId}/access/leave:
    delete:
      operationId: "CarAccessController_leaveAccess"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Access removed"
      security:
        - cookie: []
      summary: "Leave (remove yourself from) a shared car"
      tags:
        - "car-access"
  /api/car/{carId}/access/{targetUserId}:
    delete:
      operationId: "CarAccessController_removeAccess"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "targetUserId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Access removed"
      security:
        - cookie: []
      summary: "Remove a user's access to a car"
      tags:
        - "car-access"
  /api/notifications:
    get:
      operationId: "NotificationsController_list"
      parameters:
        - name: "unreadOnly"
          required: true
          in: "query"
          schema:
            type: "string"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/NotificationDto"
      security:
        - cookie: []
      summary: "List notifications for the current user"
      tags:
        - "notifications"
  /api/notifications/unread-count:
    get:
      operationId: "NotificationsController_unreadCount"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountDto"
      security:
        - cookie: []
      summary: "Get the number of unread notifications"
      tags:
        - "notifications"
  /api/notifications/{id}/read:
    patch:
      operationId: "NotificationsController_markAsRead"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDto"
      security:
        - cookie: []
      summary: "Mark a single notification as read"
      tags:
        - "notifications"
  /api/notifications/read-all:
    patch:
      operationId: "NotificationsController_markAllAsRead"
      parameters: []
      responses:
        200:
          description: ""
      security:
        - cookie: []
      summary: "Mark all notifications as read"
      tags:
        - "notifications"
  /api/notifications/read:
    delete:
      operationId: "NotificationsController_clearRead"
      parameters: []
      responses:
        204:
          description: ""
      security:
        - cookie: []
      summary: "Delete all notifications already marked as read"
      tags:
        - "notifications"
  /api/notifications/{id}:
    delete:
      operationId: "NotificationsController_delete"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: ""
      security:
        - cookie: []
      summary: "Delete a single notification"
      tags:
        - "notifications"
  /api/notifications/push-token:
    post:
      operationId: "NotificationsController_registerPushToken"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenDto"
      responses:
        204:
          description: ""
      security:
        - cookie: []
      summary: "Register a device push token for the current user"
      tags:
        - "notifications"
  /api/auth/google:
    get:
      operationId: "AuthController_login"
      parameters: []
      responses:
        200:
          description: ""
      summary: "Initiate Google OAuth login (?context=personal|business)"
      tags:
        - "auth"
  /api/auth/google/redirect:
    get:
      operationId: "AuthController_googleAuthRedirect"
      parameters: []
      responses:
        302:
          description: "Authenticated and redirected to frontend."
        401:
          description: "Google authentication failed."
      summary: "Handle Google OAuth callback"
      tags:
        - "auth"
  /api/auth/dev-login:
    get:
      operationId: "AuthController_devLogin"
      parameters: []
      responses:
        200:
          description: ""
      summary: "[dev only] Log in as the dev-bypass user, no Google OAuth"
      tags:
        - "auth"
  /api/auth/local-login:
    post:
      operationId: "AuthController_localLogin"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginDto"
      responses:
        200:
          description: "Authenticated; access token issued."
        401:
          description: "Invalid credentials or disabled account."
        403:
          description: "LOCAL_LOGIN_BUSINESS_ONLY: context \"personal\" requested."
      summary: "Log in with a company-issued username/password account"
      tags:
        - "auth"
  /api/auth/context:
    post:
      operationId: "AuthController_switchContext"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchContextDto"
      responses:
        200:
          description: "New access token issued with ctx.orgId set."
        403:
          description: "PERSONAL_SESSION or NOT_ORG_MEMBER."
      summary: "Select the active organization of a business session; issues new tokens"
      tags:
        - "auth"
  /api/auth/change-password:
    post:
      operationId: "AuthController_changePassword"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDto"
      responses:
        200:
          description: "Password changed."
        400:
          description: "Account has no password login."
        401:
          description: "Current password is incorrect."
      summary: "Change the current user's own password (company-managed accounts only)"
      tags:
        - "auth"
  /api/auth/refresh:
    post:
      operationId: "AuthController_refreshAccessToken"
      parameters: []
      responses:
        200:
          description: "New access token issued."
        401:
          description: "Refresh token missing or invalid."
      summary: "Refresh access token"
      tags:
        - "auth"
  /api/auth/me:
    get:
      operationId: "AuthController_getProfile"
      parameters: []
      responses:
        200:
          description: "User profile returned."
        401:
          description: "Invalid or missing access token."
      summary: "Get authenticated user profile"
      tags:
        - "auth"
  /api/auth/logout:
    post:
      operationId: "AuthController_logout"
      parameters: []
      responses:
        200:
          description: "Logged out successfully."
        401:
          description: "Not authenticated."
      summary: "Logout user and invalidate tokens"
      tags:
        - "auth"
  /api/legal/status:
    get:
      operationId: "LegalController_getStatus"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalStatusDto"
      security:
        - bearer: []
      summary: "Current user's legal-acceptance status (current vs. accepted terms/privacy versions)"
      tags:
        - "legal"
  /api/legal/accept:
    post:
      operationId: "LegalController_accept"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptLegalDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalStatusDto"
        409:
          description: "LEGAL_VERSION_OUTDATED — the accepted version is no longer current."
      security:
        - bearer: []
      summary: "Accept the current terms + privacy policy versions"
      tags:
        - "legal"
  /api/car/{carId}/deadline-order:
    get:
      operationId: "CarDeadlineOrderController_getOrder"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineOrderDto"
      security:
        - cookie: []
      summary: "Get this user's manual order for a car's deadlines"
      tags:
        - "car-deadline-order"
    put:
      operationId: "CarDeadlineOrderController_setOrder"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeadlineOrderDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineOrderDto"
      security:
        - cookie: []
      summary: "Replace this user's manual order for a car's deadlines"
      tags:
        - "car-deadline-order"
  /api/car/{carId}/deadline-order/dismissed:
    put:
      operationId: "CarDeadlineOrderController_setDismissed"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDismissedDeadlinesDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineOrderDto"
      security:
        - cookie: []
      summary: "Replace this user's dismissed deadline keys for a car"
      tags:
        - "car-deadline-order"
  /api/car/{carId}/maintenance-settings:
    get:
      operationId: "CarMaintenanceSettingsController_getSettings"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "profileId"
          required: true
          in: "query"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MaintenanceSettingDto"
      security:
        - cookie: []
      summary: "Get this user's maintenance tracking settings for one of their maintenance profiles on a car, merged with the global defaults"
      tags:
        - "car-maintenance-settings"
  /api/car/{carId}/maintenance-settings/{item}:
    put:
      operationId: "CarMaintenanceSettingsController_setSetting"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "item"
          required: true
          in: "path"
          schema:
            type: "string"
        - name: "profileId"
          required: true
          in: "query"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceSettingDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceSettingDto"
      security:
        - cookie: []
      summary: "Update this user's tracked flag and/or custom interval for one Plan item, within one maintenance profile, on a car"
      tags:
        - "car-maintenance-settings"
  /api/car/{carId}/maintenance-profiles:
    get:
      operationId: "CarMaintenanceProfilesController_getProfiles"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MaintenanceProfileDto"
      security:
        - cookie: []
      summary: "Get this user's named custom maintenance profiles for a car"
      tags:
        - "car-maintenance-profiles"
    post:
      operationId: "CarMaintenanceProfilesController_createProfile"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaintenanceProfileDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceProfileDto"
      security:
        - cookie: []
      summary: "Create a new named custom maintenance profile for a car"
      tags:
        - "car-maintenance-profiles"
  /api/car/{carId}/maintenance-profiles/{profileId}:
    patch:
      operationId: "CarMaintenanceProfilesController_renameProfile"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "profileId"
          required: true
          in: "path"
          schema:
            type: "number"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaintenanceProfileDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceProfileDto"
      security:
        - cookie: []
      summary: "Rename a custom maintenance profile"
      tags:
        - "car-maintenance-profiles"
    delete:
      operationId: "CarMaintenanceProfilesController_deleteProfile"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "profileId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: ""
      security:
        - cookie: []
      summary: "Delete a custom maintenance profile and its overrides"
      tags:
        - "car-maintenance-profiles"
  /api/car:
    post:
      operationId: "CarController_createCar"
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AddCarDto"
      responses:
        201:
          description: "Car created successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        403:
          description: "Forbidden."
      security:
        - cookie: []
      summary: "Create a new car"
      tags:
        - "car"
    put:
      operationId: "CarController_updateCar"
      parameters: []
      responses:
        200:
          description: "Car updated successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        404:
          description: "Car not found."
      security:
        - cookie: []
      summary: "Update a car"
      tags:
        - "car"
    get:
      operationId: "CarController_getAllCars"
      parameters: []
      responses:
        200:
          description: "Return list of cars."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CarDto"
      security:
        - cookie: []
      summary: "Get all cars for authenticated user"
      tags:
        - "car"
  /api/car/{id}:
    get:
      operationId: "CarController_getCar"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Return car details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        404:
          description: "Car not found."
      security:
        - cookie: []
      summary: "Get car by ID"
      tags:
        - "car"
    delete:
      operationId: "CarController_deleteCar"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Car deleted successfully."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        404:
          description: "Car not found."
      security:
        - cookie: []
      summary: "Delete a car"
      tags:
        - "car"
  /api/car/photo/{photoId}:
    delete:
      operationId: "CarController_deletePhoto"
      parameters:
        - name: "photoId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        204:
          description: "Photo deleted."
        403:
          description: "No edit access to the photo's car."
        404:
          description: "Photo not found."
      security:
        - cookie: []
      summary: "Delete a car photo"
      tags:
        - "car"
  /api/car/photo/{photoId}/default:
    patch:
      operationId: "CarController_setDefaultPhoto"
      parameters:
        - name: "photoId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        204:
          description: "Default photo updated."
        403:
          description: "No edit access to the photo's car."
        404:
          description: "Photo not found."
      security:
        - cookie: []
      summary: "Set a photo as the default for its car"
      tags:
        - "car"
  /api/car/{id}/sold:
    patch:
      operationId: "CarController_markAsSold"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Car marked as sold."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        403:
          description: "Only the owner can archive this car."
      security:
        - cookie: []
      summary: "Mark a car as sold (archive)"
      tags:
        - "car"
  /api/car/{id}/restore:
    patch:
      operationId: "CarController_restoreCar"
      parameters:
        - name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Car restored to active."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarDto"
        403:
          description: "Only the owner can restore this car."
      security:
        - cookie: []
      summary: "Restore a sold car back to active"
      tags:
        - "car"
  /api/car/user/{userId}:
    get:
      operationId: "CarController_getCarsByUser"
      parameters:
        - name: "userId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Return list of cars."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CarDto"
      security:
        - cookie: []
      summary: "Get the personal cars of a user (only yourself)"
      tags:
        - "car"
  /api/vehicle-catalog/makes:
    get:
      operationId: "VehicleCatalogController_getMakes"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MakeResponseDto"
      summary: "List all car makes"
      tags:
        - "vehicle-catalog"
  /api/vehicle-catalog/makes/{makeId}/models:
    get:
      operationId: "VehicleCatalogController_getModels"
      parameters:
        - name: "makeId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ModelResponseDto"
      summary: "List models for a given make"
      tags:
        - "vehicle-catalog"
  /api/vehicle-catalog/models/{modelId}/years:
    get:
      operationId: "VehicleCatalogController_getYears"
      parameters:
        - name: "modelId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/YearResponseDto"
      summary: "List years for a given model"
      tags:
        - "vehicle-catalog"
  /api/maintenance-record/extract-invoice:
    post:
      description: "All files must belong to ONE intervention (e.g. a parts invoice plus the workshop work order). Parts repeated across documents are counted once; totals are computed server-side. The user must review before saving."
      operationId: "MaintenanceRecordController_extractInvoice"
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "files"
              properties:
                files:
                  type: "array"
                  items:
                    type: "string"
                    format: "binary"
                  maxItems: 3
                car_id:
                  type: "integer"
                  description: "Optional: gives the model vehicle context."
                lang:
