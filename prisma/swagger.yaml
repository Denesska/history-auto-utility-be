      tags:
        - "organization"
  /api/organization/{organizationId}/members/{targetUserId}:
    delete:
      operationId: "OrganizationController_removeMember"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "targetUserId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Membership removed"
      security:
        - bearer: []
      summary: "Remove a member the caller is allowed to manage from the organization (see OrganizationService.removeMember)"
      tags:
        - "organization"
  /api/organization/{organizationId}/cars:
    get:
      operationId: "OrganizationController_getCars"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/OrganizationCarDto"
      security:
        - bearer: []
      summary: "List every car currently in the organization's fleet"
      tags:
        - "organization"
  /api/organization/{organizationId}/cars/import:
    post:
      operationId: "OrganizationController_importCars"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCarsResultDto"
      security:
        - bearer: []
      summary: "Bulk-create cars directly in the fleet from an uploaded .csv/.xlsx/.xls file — Director-tier only (enforced per-row in CarService.createCar, same as adding a single company car). A bad row fails on its own; the rest of the file still imports. Columns: make, model (required), variant, year, license_plate, vin, nickname, fuel_type, transmission, color, current_mileage."
      tags:
        - "organization"
  /api/organization/{organizationId}/cars/{carId}:
    delete:
      operationId: "OrganizationController_removeCar"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Car un-linked from the organization"
      security:
        - bearer: []
      summary: "Remove a car from the organization (un-links it, doesn't delete it — it becomes personal again)"
      tags:
        - "organization"
  /api/organization/{organizationId}:
    delete:
      operationId: "OrganizationController_deleteOrganization"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Organization deleted"
      security:
        - bearer: []
      summary: "Delete an organization permanently — its cars and suppliers aren't deleted, they become personal again"
      tags:
        - "organization"
  /api/car/{carId}/driver-assignment:
    get:
      operationId: "DriverAssignmentController_getCurrent"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAssignmentDto"
      summary: "Get a car's current driver, or null if unassigned"
      tags:
        - "driver-assignment"
    post:
      operationId: "DriverAssignmentController_assign"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDriverDto"
      responses:
        201:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAssignmentDto"
      summary: "Assign a driver to a car, closing any current assignment"
      tags:
        - "driver-assignment"
    delete:
      operationId: "DriverAssignmentController_unassign"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: ""
      summary: "End a car's current driver assignment"
      tags:
        - "driver-assignment"
  /api/car/{carId}/driver-assignment/history:
    get:
      operationId: "DriverAssignmentController_getHistory"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DriverAssignmentDto"
      summary: "Get a car's full driver assignment history, newest first"
      tags:
        - "driver-assignment"
  /api/car/{carId}/driver-assignment/candidates:
    get:
      operationId: "DriverAssignmentController_getCandidates"
      parameters:
        - name: "carId"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AssignableUserDto"
      summary: "List every accepted member of the car's organization (any role) that can be assigned to the car"
      tags:
        - "driver-assignment"
  /api/organization/{organizationId}/cost-dashboard:
    get:
      operationId: "FleetCostController_getDashboard"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
        - name: "range"
          required: false
          in: "query"
          description: "Days to look back; 0 = all time. Default 90."
          schema:
            type: "number"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetCostDashboardDto"
      security:
        - bearer: []
      summary: "Fleet-wide maintenance cost totals, monthly trend, and per-car breakdown"
      tags:
        - "fleet-cost"
  /api/account/export:
    get:
      operationId: "AccountController_exportMyData"
      parameters: []
      responses:
        200:
          description: "A JSON file download."
      security:
        - bearer: []
      summary: "Download all personal data held about the calling user (GDPR Art. 15/20)"
      tags:
        - "account"
  /api/account:
    delete:
      operationId: "AccountController_deleteMyAccount"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountDto"
      responses:
        200:
          description: "Account deleted."
        400:
          description: "ACCOUNT_DELETE_CONFIRMATION_MISMATCH"
        403:
          description: "ACCOUNT_COMPANY_MANAGED"
        409:
          description: "ACCOUNT_OWNS_ORGANIZATION"
      security:
        - bearer: []
      summary: "Permanently delete the calling user's account and personal data (GDPR Art. 17)"
      tags:
        - "account"
  /api/ai-usage/me:
    get:
      operationId: "AiUsageController_me"
      parameters: []
      responses:
        200:
          description: ""
      security:
        - cookie: []
      summary: "Current user's AI usage against daily/monthly budgets"
      tags:
        - "ai-usage"
info:
  title: "History Auto Utility API"
  description: "API documentation for History Auto Utility"
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: "http://localhost:3000"
    description: "development"
components:
  securitySchemes:
    bearer:
      scheme: "bearer"
      bearerFormat: "JWT"
      type: "http"
    cookie:
      type: "apiKey"
      in: "cookie"
      name: "access_token"
  schemas:
    ShareUserSearchResultDto:
      type: "object"
      properties:
        id:
          type: "number"
        email:
          type: "string"
        first_name:
          type: "string"
        last_name:
          type: "string"
        picture:
          type: "string"
      required:
        - "id"
        - "email"
        - "first_name"
        - "last_name"
    SharedCarDto:
      type: "object"
      properties:
        id:
          type: "number"
        make:
          type: "string"
        model:
          type: "string"
        variant:
          type: "string"
        year:
          type: "number"
        license_plate:
          type: "string"
        shared_role:
          type: "string"
          enum:
            - "OWNER"
            - "FULL"
            - "USER"
            - "MAINTENANCE"
            - "VIEWER"
        accepted_at:
          format: "date-time"
          type: "string"
        organization_id:
          type: "number"
          nullable: true
        organization_name:
          type: "string"
          nullable: true
        owner:
          nullable: true
          type: "object"
          allOf:
            - $ref: "#/components/schemas/ShareUserSearchResultDto"
      required:
        - "id"
        - "make"
        - "model"
        - "year"
        - "license_plate"
        - "shared_role"
    CarAccessUserDto:
      type: "object"
      properties:
        id:
          type: "number"
        email:
          type: "string"
        first_name:
          type: "string"
        last_name:
          type: "string"
        picture:
          type: "string"
      required:
        - "id"
        - "email"
        - "first_name"
        - "last_name"
    CarAccessDto:
      type: "object"
      properties:
        id:
          type: "number"
        car_id:
          type: "number"
        role:
          type: "string"
          enum:
            - "OWNER"
            - "FULL"
            - "USER"
            - "MAINTENANCE"
            - "VIEWER"
        user:
          $ref: "#/components/schemas/CarAccessUserDto"
        invited_by:
          $ref: "#/components/schemas/CarAccessUserDto"
        accepted_at:
          format: "date-time"
          type: "string"
        created_at:
          format: "date-time"
          type: "string"
      required:
        - "id"
        - "car_id"
        - "role"
        - "user"
        - "invited_by"
        - "created_at"
    InviteUserDto:
      type: "object"
      properties:
        email:
          type: "string"
          example: "friend@example.com"
        role:
          type: "string"
          enum:
            - "OWNER"
            - "FULL"
            - "USER"
            - "MAINTENANCE"
            - "VIEWER"
          example: "VIEWER"
      required:
        - "email"
        - "role"
    ChangeRoleDto:
      type: "object"
      properties:
        role:
          type: "string"
          enum:
            - "OWNER"
            - "FULL"
            - "USER"
            - "MAINTENANCE"
            - "VIEWER"
          example: "VIEWER"
      required:
        - "role"
    NotificationDto:
      type: "object"
      properties:
        id:
          type: "number"
        type:
          type: "string"
          enum:
            - "CAR_SHARED"
            - "CAR_ACCESS_REMOVED"
            - "CAR_ACCESS_ROLE_CHANGED"
            - "CAR_ACCESS_ACCEPTED"
            - "DOCUMENT_EXPIRING"
            - "MAINTENANCE_DUE"
            - "VIN_CONFLICT"
            - "LICENSE_PLATE_CONFLICT"
            - "ORG_INVITED"
            - "ORG_INVITE_ACCEPTED"
            - "BUSINESS_ACCESS_REQUESTED"
            - "BUSINESS_ACCESS_APPROVED"
            - "BUSINESS_ACCESS_REJECTED"
            - "AI_QUOTA_BLOCKED"
        data:
          type: "object"
        read_at:
          format: "date-time"
          type: "string"
          nullable: true
        created_at:
          format: "date-time"
          type: "string"
      required:
        - "id"
        - "type"
        - "data"
        - "read_at"
        - "created_at"
    UnreadCountDto:
      type: "object"
      properties:
        count:
          type: "number"
      required:
        - "count"
    RegisterPushTokenDto:
      type: "object"
      properties:
        token:
          type: "string"
        platform:
          type: "string"
          enum:
            - "ANDROID"
            - "WEB"
      required:
        - "token"
        - "platform"
    LocalLoginDto:
      type: "object"
      properties:
        username:
          type: "string"
          example: "gandzde"
        email:
          type: "string"
          example: "gandzde@denhau-solutions"
        companyCode:
          type: "string"
          example: "denhau-solutions"
        password:
          type: "string"
        context:
          type: "string"
          enum:
            - "business"
            - "personal"
          default: "business"
      required:
        - "password"
    SwitchContextDto:
      type: "object"
      properties:
        organizationId:
          type: "number"
          example: 1
      required:
        - "organizationId"
    ChangePasswordDto:
      type: "object"
      properties:
        currentPassword:
          type: "string"
        newPassword:
          type: "string"
      required:
        - "currentPassword"
        - "newPassword"
    LegalStatusDto:
      type: "object"
      properties:
        termsVersion:
          type: "string"
          example: "2026-10-10"
          description: "Current terms version (CURRENT_TERMS_VERSION)."
        privacyVersion:
          type: "string"
          example: "2026-10-10"
          description: "Current privacy policy version (CURRENT_PRIVACY_VERSION)."
        acceptedTermsVersion:
          type: "string"
          nullable: true
        acceptedPrivacyVersion:
          type: "string"
          nullable: true
        acceptedAt:
          type: "string"
          nullable: true
        needsAcceptance:
          type: "boolean"
          description: "True unless the accepted terms AND privacy versions both equal the current ones."
      required:
        - "termsVersion"
        - "privacyVersion"
        - "needsAcceptance"
    AcceptLegalDto:
      type: "object"
      properties:
        termsVersion:
          type: "string"
          example: "2026-10-10"
          description: "Must equal the current terms version (CURRENT_TERMS_VERSION) or the request is rejected."
        privacyVersion:
          type: "string"
          example: "2026-10-10"
          description: "Must equal the current privacy policy version (CURRENT_PRIVACY_VERSION) or the request is rejected."
      required:
        - "termsVersion"
        - "privacyVersion"
    DeadlineOrderDto:
      type: "object"
      properties:
        car_id:
          type: "number"
          example: 1
        order:
          example:
            - "doc:RCA"
            - "plan:OIL_CHANGE"
            - "doc:ITP"
          description: "Ordered list of deadline keys. Empty means the user has no manual order and the client falls back to sorting by urgency."
          type: "array"
          items:
            type: "string"
        dismissed:
          example:
            - "doc:ROV"
          description: "Deadline keys the user dismissed from the list entirely. Empty means nothing is dismissed."
          type: "array"
          items:
            type: "string"
      required:
        - "car_id"
        - "order"
        - "dismissed"
    UpdateDeadlineOrderDto:
      type: "object"
      properties:
        order:
          example:
            - "doc:RCA"
            - "plan:OIL_CHANGE"
            - "doc:ITP"
          description: "Send an empty array to drop the manual order and go back to sorting by urgency."
          type: "array"
          items:
            type: "string"
      required:
        - "order"
    UpdateDismissedDeadlinesDto:
      type: "object"
      properties:
        dismissed:
          example:
            - "doc:ROV"
          description: "Send an empty array to un-dismiss everything."
          type: "array"
          items:
            type: "string"
      required:
        - "dismissed"
    PlanItemKey:
      type: "string"
      enum:
        - "ENGINE_OIL"
        - "AIR_FILTER"
        - "CABIN_FILTER"
        - "FUEL_FILTER"
        - "GEARBOX_OIL"
        - "DIFFERENTIAL_OIL"
        - "BRAKE_FLUID"
        - "COOLANT"
        - "POWER_STEERING_FLUID"
        - "AC_SERVICE"
        - "TIRES"
        - "INSPECTION"
        - "TIMING_BELT"
        - "BRAKE_PARTS"
        - "BATTERY"
        - "LIGHTS"
        - "SUSPENSION"
        - "ENGINE_REPAIR"
        - "BODYWORK"
        - "ELECTRICAL"
    MaintenanceSettingDto:
      type: "object"
      properties:
        profile_id:
          type: "number"
          example: 1
          description: "Which MaintenanceProfile this override belongs to"
