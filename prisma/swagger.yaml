        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembershipDto"
      security:
        - bearer: []
      summary: "Change the role of a member the caller is allowed to manage, to a role the caller is allowed to assign (see OrganizationService.changeRole)"
      tags:
        - "organization"
  /api/organization/{organizationId}/members/leave:
    delete:
      operationId: "OrganizationController_leaveOrganization"
      parameters:
        - name: "organizationId"
          required: true
          in: "path"
          schema:
            type: "number"
      responses:
        204:
          description: "Membership removed"
      security:
        - bearer: []
