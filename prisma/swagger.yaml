        - "organization"
    get:
      operationId: "OrganizationController_getMyOrganizations"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MyOrganizationDto"
      security:
        - bearer: []
      summary: "List every organization the current user belongs to (pending invites included)"
      tags:
        - "organization"
  /api/organization/{organizationId}/members:
    get:
      operationId: "OrganizationController_getMembers"
