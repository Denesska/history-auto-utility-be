            - "BRAKE_SERVICE"
            - "TRANSMISSION_SERVICE"
            - "TIRE_SERVICE"
            - "FLUID_SERVICE"
            - "ENGINE_SERVICE"
            - "INSPECTION"
            - "BATTERY_SERVICE"
            - "FILTER_SERVICE"
            - "LIGHT_SERVICE"
            - "COMBUSTIBIL"
            - "OTHER"
        plan_items:
          type: "array"
          example:
            - "ENGINE_OIL"
            - "AIR_FILTER"
          description: "Plan items this record resets. On update, when provided it replaces the whole set; when omitted it is left unchanged. If service_category is not given, it is derived from these."
          items:
            $ref: "#/components/schemas/PlanItemKey"
        custom_items:
          example:
            - "Replaced wiper blades"
          maxItems: 10
          description: "Free-text work items typed by the user (max 10, 1-60 chars each, trimmed, deduped case-insensitively). On update, when provided it replaces the whole array; when omitted it is left unchanged."
          type: "array"
          items:
            type: "string"
        cost:
          type: "number"
          example: 250
        currency:
          type: "string"
          example: "RON"
          description: "Currency the cost was paid in. Defaults to RON. cost_ron/exchange_rate/exchange_rate_date/exchange_rate_source are always computed server-side."
        expiry_date:
          type: "string"
          example: "2024-01-01"
        reminder_title:
          type: "string"
          example: "Tire swap"
          nullable: true
          maxLength: 80
          description: "Name of the reminder date; cleared server-side when expiry_date is cleared."
        is_diy:
          type: "boolean"
          example: false
        fuel_liters:
          type: "number"
          example: 42.5
          description: "Fuel quantity in liters, for ALIMENTARE records (combustion cars)"
        energy_kwh:
          type: "number"
          example: 32.5
          description: "Energy delivered in kWh, for ALIMENTARE records (electric/hybrid cars charging instead of refueling)"
        is_company_expense:
          type: "boolean"
          example: false
          description: "Whether this expense is a company expense (reimbursable)"
        labor_cost:
          type: "number"
          example: 150
          nullable: true
          description: "Labor (manopera) amount, in the record currency"
        parts_cost:
          type: "number"
          example: 300
          nullable: true
          description: "User override of the parts total. null/omitted (with parts_cost_currency null) = automatic sum of the parts."
        parts_cost_currency:
          type: "string"
          example: "RON"
          nullable: true
          description: "Currency of parts_cost; stored null whenever parts_cost is null."
        notes:
          type: "string"
          example: "Changed oil and filters, checked brakes"
          nullable: true
          description: "Free multi-line description of the work done"
        parts:
          type: "array"
          items:
            $ref: "#/components/schemas/MaintenancePartInputDto"
        supplier_id:
          type: "number"
          example: 1
          nullable: true
          description: "Supplier directory entry (garage/workshop) that carried out this work. Must be a supplier the caller can see."
        service_name:
          type: "string"
          example: "Auto Service Popescu"
          nullable: true
          maxLength: 80
          description: "Free-text workshop name (personal context). Ignored and stored as null when supplier_id is set."
      required:
